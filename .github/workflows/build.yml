name: Build ESP32 Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v3.3.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install node dependencies (ejs-cli)
        run: npm install -g ejs-cli

      - name: Install CUE
        run: |
          CUE_VERSION="v0.6.0"
          CUE_TARBALL="cue_${CUE_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "/tmp/${CUE_TARBALL}" "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/${CUE_TARBALL}"
          echo "3ae7b28e12de2e0554c28d9a9eb3dd919f0640274c925ba0e36de9079af80de2  /tmp/${CUE_TARBALL}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "/tmp/${CUE_TARBALL}" cue

      - name: Generate templates and config
        run: |
          ./update_config.sh config_gen/config/SuperGreenOS/Controllers/Driver config.driver.json
          ./update_templates.sh config.driver.json

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          make -j$(nproc)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/firmware.bin
            build/bootloader/bootloader.bin
            build/partitions.bin
            build/ota_data_initial.bin
          if-no-files-found: error
