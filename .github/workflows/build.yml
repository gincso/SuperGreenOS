name: Build ESP32 Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # NOTE: do NOT run this job inside the espressif/idf:v3.3.6
      # container. That image is Ubuntu 18.04 (glibc 2.27), and
      # actions/checkout@v4's node24 requires glibc 2.28, so checkout
      # fails before any build step runs. Checkout on the host
      # instead, and run only the build inside Docker.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware in ESP-IDF container
        run: |
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v3.3.6 bash -c '
            set -e
            # The IDF image has no Node/npm, so install Node 16 from
            # the official binary (same approach as docker_build.sh).
            NODE_VERSION="v16.20.2"
            curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            npm install -g ejs-cli
            # Do NOT regenerate config.driver.json with CUE here.
            # The config_gen/*.cue files use pre-0.3 CUE syntax that
            # fails on every modern CUE release (tested 0.3, 0.4, 0.6),
            # and a failed `cue export` would truncate the committed
            # JSON. The committed config.driver.json is the source
            # of truth until the cue sources are migrated.
            ./update_templates.sh config.driver.json
            . $IDF_PATH/export.sh
            make defconfig
            grep PYTHON sdkconfig
            make -j$(nproc)
          '

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/firmware.bin
            build/bootloader/bootloader.bin
            build/partitions.bin
            build/ota_data_initial.bin
          if-no-files-found: error
