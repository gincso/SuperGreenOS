name: Build ESP32 Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v3.3.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The IDF image has no Node/npm, so install Node 16 from the
      # official binary (same approach as docker_build.sh), then ejs-cli.
      - name: Install Node and ejs-cli
        run: |
          NODE_VERSION="v16.20.2"
          curl -fsSL -o "/tmp/node.tar.xz" "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
          npm install -g ejs-cli

      # NOTE: do NOT regenerate config.driver.json with CUE here.
      # The config_gen/*.cue files use pre-0.3 CUE syntax that fails
      # on every modern CUE release (tested 0.3, 0.4, 0.6), and a
      # failed `cue export` would truncate the committed JSON.
      # The committed config.driver.json is the source of truth
      # until the cue sources are migrated to modern CUE.
      - name: Generate templates from committed config
        run: ./update_templates.sh config.driver.json

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          make defconfig
          grep PYTHON sdkconfig
          make -j$(nproc)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/firmware.bin
            build/bootloader/bootloader.bin
            build/partitions.bin
            build/ota_data_initial.bin
          if-no-files-found: error
